[package]
name = "picopc-sdk"
version = "0.2.1"
edition = "2024"
license = "MIT"
description = "The official SDK for PicoPC"
repository = "https://github.com/rocketLover11/picopc-sdk"
readme = "README.md"

[lib]
name = "picopc_sdk"
path = "src/lib.rs"

[dependencies]
cortex-m = "0.7"
cortex-m-rt = "0.7"
embedded-hal = "1.0.0"
defmt = "1"
defmt-rtt = "1"
nb = "1.1" 

rp2040-boot2 = "0.3"
rp2040-hal = { version = "0.11", features = ["rt", "critical-section-impl"] }
panic-probe = { version = "1", features = ["print-defmt"] }